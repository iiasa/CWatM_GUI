name: Dependency audit

# sast.md step 8: known vulnerabilities in the PINNED libraries the GUI ships with
# (requirements.txt - PySide6/Chromium, rasterio/GDAL, requests/urllib3, ...).
# Pinned versions never update by themselves, so a published CVE would otherwise sit
# in every installed copy unnoticed.
#
# Weekly + on demand, NOT on push: it never blocks anyone's work. A red run (and
# GitHub's notification e-mail) is the alert; Dependabot alerts in the Security tab
# show the same from GitHub's side. Fixing = updating the pin, which changes the
# bundled exe - so it goes through a normal release (/creategui), not straight in.

on:
  schedule:
    - cron: '17 6 * * 1'        # Mondays 06:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pip-audit:
    name: pip-audit (requirements.txt)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pip-audit
        run: pip install "pip-audit==2.10.1"

      # --no-deps: requirements.txt is fully pinned (a pip freeze), so nothing has to
      # be resolved or installed - only the listed versions are looked up.
      - name: Audit the pinned runtime requirements
        run: pip-audit -r requirements.txt --no-deps --disable-pip --desc on

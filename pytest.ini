[pytest]
testpaths = tests
# -ra shows why anything was skipped/xfailed; the xfails are two recorded defects in
# cell_formula (see tests/test_cell_formula.py::TestKnownBugs) and are strict, so a fix
# turns them into failures rather than letting them rot unnoticed.
addopts = -ra --strict-markers
filterwarnings =
    # rasterio 1.5.0 x numpy 2.5 - the same warning src/gui/utils/warning_filters.py
    # silences at runtime; it is raised inside rasterio but blamed on its caller.
    ignore:Setting the shape on a NumPy array has been deprecated:DeprecationWarning
